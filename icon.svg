<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="DSH boot animation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#13233d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9dff"/>
      <stop offset="1" stop-color="#9fd0ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <circle cx="64" cy="60" r="30" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M55 45 L82 60 L55 75 Z" fill="url(#accent)" filter="url(#glow)"/>
  <rect x="28" y="94" width="72" height="6" rx="3" fill="#ffffff" fill-opacity="0.14"/>
  <rect x="28" y="94" width="46" height="6" rx="3" fill="url(#accent)"/>
  <circle cx="74" cy="97" r="3.2" fill="#eaf4ff"/>
</svg>
